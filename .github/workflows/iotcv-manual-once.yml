# TẠM THỜI: deploy một lần từ feat/aws-ec2 trước khi merge PR #56. Xoá sau khi chạy.
# Lần 4: sau khi sửa User-Agent và dọn venv cũ.
name: iotcv manual deploy (temporary)

on:
  push:
    branches: [feat/aws-ec2]
    paths: [.github/workflows/iotcv-manual-once.yml]

permissions:
  contents: read

concurrency:
  group: iotcv-deploy-demo
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      application: ${{ steps.digests.outputs.application }}
      tunnel: ${{ steps.digests.outputs.tunnel }}
    env:
      REGISTRY_IMAGE: ghcr.io/ngtukien/iot-cv
      TUNNEL_IMAGE: ghcr.io/ngtukien/iot-cv-tunnel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/cloudflared.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.TUNNEL_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: digests
        run: |
          app=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          tunnel=$(docker buildx imagetools inspect "${TUNNEL_IMAGE}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          echo "application=${REGISTRY_IMAGE}@${app}" >> "$GITHUB_OUTPUT"
          echo "tunnel=${TUNNEL_IMAGE}@${tunnel}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: images
    runs-on: [self-hosted, linux, X64, iotcv-demo]
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: |
          rm -rf "${RUNNER_TEMP}/iotcv-tools"  # runner self-hosted có lúc để lại venv dở từ job trước
          uv venv --python 3.13 "${RUNNER_TEMP}/iotcv-tools"
          uv pip sync --only-binary :all: --require-hashes \
            --python "${RUNNER_TEMP}/iotcv-tools/bin/python" infra/requirements.lock
      - env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ghcr.io/ngtukien/iot-cv
          TUNNEL_REGISTRY_IMAGE: ghcr.io/ngtukien/iot-cv-tunnel
          IOTCV_IMAGE: ${{ needs.images.outputs.application }}
          CLOUDFLARED_IMAGE: ${{ needs.images.outputs.tunnel }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_OPERATION: deploy
          ENVIRONMENT: demo
          PUBLIC_HOSTNAME: uav.ngtukien.id.vn
          DATA_VOLUME_ID: ${{ vars.DATA_VOLUME_ID }}
        run: |
          sudo --preserve-env=CLOUDFLARE_TUNNEL_TOKEN,REGISTRY_USERNAME,REGISTRY_PASSWORD,REGISTRY_IMAGE,TUNNEL_REGISTRY_IMAGE,IOTCV_IMAGE,CLOUDFLARED_IMAGE,RELEASE_SHA,DEPLOY_OPERATION,ENVIRONMENT,PUBLIC_HOSTNAME,DATA_VOLUME_ID \
            "${RUNNER_TEMP}/iotcv-tools/bin/python" infra/scripts/deploy.py
